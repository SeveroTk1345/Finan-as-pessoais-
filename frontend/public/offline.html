<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sem conexão · Finanças</title>
<style>
  body { margin: 0; font: 18px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #111; background: #fff; }
  main { max-width: 460px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 48px) 16px 32px; }
  h1 { font-size: 1.6rem; margin: 0 0 12px; }
  p { margin: 0 0 16px; color: #4a4a4a; }
  button { min-height: 48px; padding: 0 20px; border-radius: 12px; border: 2px solid #111; background: #111; color: #fff; font: inherit; font-weight: 650; width: 100%; }
</style>
</head>
<body>
<main>
  <h1>Sem conexão com o servidor</h1>
  <p>Não foi possível abrir o aplicativo agora. Verifique se o celular está com internet.</p>
  <p>Nenhum dado financeiro fica guardado neste aparelho, por segurança. Quando a conexão voltar, tudo aparece de novo.</p>
  <button type="button" onclick="location.reload()">Tentar de novo</button>
</main>
</body>
</html>
