# Restaura uma cópia cifrada (do workflow "Backup do banco") em um banco VAZIO.
# Nunca grava no banco em uso: o script recusa o endereço de produção e bancos com tabelas.
#
# Antes: crie no Neon um banco vazio (ex.: "restaurado") e salve o endereço dele no
# segredo FIN_RESTORE_DATABASE_URL. Depois rode este workflow informando o número da
# execução do backup (aparece na URL dela: .../actions/runs/NUMERO).
name: Restaurar backup

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Número da execução do backup a restaurar"
        required: true
      confirmacao:
        description: 'Digite RESTAURAR para confirmar'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  restaurar:
    if: github.repository == 'SeveroTk1345/Finan-as-pessoais-' && inputs.confirmacao == 'RESTAURAR'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FIN_RESTORE_DATABASE_URL: ${{ secrets.FIN_RESTORE_DATABASE_URL }}
      FIN_DATABASE_ADMIN_URL: ${{ secrets.FIN_DATABASE_ADMIN_URL }}
      FIN_BACKUP_PASSPHRASE: ${{ secrets.FIN_BACKUP_PASSPHRASE }}
      RUN_ID: ${{ inputs.run_id }}
    steps:
      - name: Conferir entrada e segredos
        run: |
          case "$RUN_ID" in ''|*[!0-9]*) echo "::error::run_id deve ser só números"; exit 1 ;; esac
          if [ -z "$FIN_RESTORE_DATABASE_URL" ] || [ -z "$FIN_BACKUP_PASSPHRASE" ]; then
            echo "::error::Configure os segredos FIN_RESTORE_DATABASE_URL e FIN_BACKUP_PASSPHRASE."
            exit 1
          fi
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y postgresql-client-16 gnupg
      - uses: actions/download-artifact@v4
        with:
          name: backup-cifrado-${{ inputs.run_id }}
          path: entrada
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Restaurar
        run: |
          arquivo="$(ls entrada/*.dump.gpg | head -n 1)"
          scripts/restaurar-cifrado.sh "$arquivo"
